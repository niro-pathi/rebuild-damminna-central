name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brand:
    name: Brand and copy rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Brand audit
        run: ./scripts/brand-audit.sh

  html:
    name: HTML and JS sanity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inline script parses
        run: |
          node -e "
            const fs = require('fs');
            const h = fs.readFileSync('index.html', 'utf8');
            const m = h.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) { console.error('no inline script found'); process.exit(1); }
            new Function(m[1]);
            console.log('inline script parses');
          "
      - name: No browser storage APIs
        run: |
          if grep -nE '\b(localStorage|sessionStorage)\b' index.html; then
            echo "FAIL: browser storage is not used in this project"; exit 1
          fi
          echo ok

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Look for obvious credentials
        run: |
          if grep -rInE '(sk_live_|sk_test_|rk_live_|-----BEGIN [A-Z ]*PRIVATE KEY|"type": *"service_account")' \
               --exclude-dir=.git --exclude-dir=.github --exclude-dir=fonts . ; then
            echo "FAIL: credential-shaped string committed"; exit 1
          fi
          echo ok
